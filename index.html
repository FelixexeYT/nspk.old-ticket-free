<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата проезда</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Верхняя панель с выбором типа чека -->
    <div class="top-bar" id="topBar">
        <span class="top-bar-label">Вид чека:</span>
        <button class="type-btn active" data-type="ticket">Билет</button>
        <button class="type-btn" data-type="receipt">Чек</button>
    </div>

    <!-- Форма ввода -->
    <div class="card" id="inputSection">
        <h1>Данные билета</h1>

        <label for="transportType">Вид транспорта:</label>
        <select id="transportType">
            <option value="Автобус">Автобус</option>
            <option value="Троллейбус">Троллейбус</option>
        </select>

        <label for="routeNumber">Номер маршрута:</label>
        <input type="text" id="routeNumber" placeholder="Введите номер маршрута">

        <label for="vehicleNumber">Номер т/с:</label>
        <input type="text" id="vehicleNumber" placeholder="Введите номер ТС">

        <label for="price">Стоимость проезда:</label>
        <input type="text" id="price" placeholder="Введите стоимость">

        <button id="continueBtn" onclick="showTicket()">Продолжить</button>
    </div>

    <!-- Билет -->
    <div class="ticket-page" id="ticketSection" style="display: none;">
        <div class="ticket-inner" id="ticketToDownload">
            <h1 class="header-title">Уведомление об оплате</h1>

            <p class="success-text">Ваш проезд успешно оплачен!</p>

            <div class="payment-info">
                <div class="payment-info__vehicle-type">
                    <span id="displayType">Автобус</span>: №<span id="displayBusNumber"></span>
                </div>
                <div class="payment-info__price">
                    <span id="displayPrice"></span>
                </div>
                <div class="payment-info__date" id="currentDate"></div>
                <div class="payment-info__vehicle-number">
                    Т/С: <span id="displayVehicleNumber"></span>
                </div>
            </div>

            <div class="payment-timer">
                <p class="payment-timer__label">С момента оплаты прошло:</p>
                <div class="payment-timer__value" id="timer">00:00:00</div>
            </div>

            <div class="ticket-qrcode">
                <img id="qrCode" src="" alt="QR-код билета">
            </div>

            <div class="ticket-info">
                Предъявите контролеру QR-код.<br>
                Чтобы сохранить реквизиты билета, нажмите кнопку «Скачать»
            </div>

            <button class="btn-download" onclick="saveTicket()">Скачать билет</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
