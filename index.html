<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата проезда</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Верхняя панель с выбором типа чека -->
    <div class="top-bar">
        <span class="top-bar-label">Вид чека:</span>
        <button class="type-btn active" data-type="ticket">Билет</button>
        <button class="type-btn" data-type="receipt">Чек</button>
    </div>

    <!-- Белое окно ввода -->
    <div class="input-container" id="inputSection">
        <h1 class="form-title">Данные билета</h1>

        <label for="transportType">Вид транспорта:</label>
        <select id="transportType">
            <option value="Автобус">Автобус</option>
            <option value="Троллейбус">Троллейбус</option>
        </select>

        <label for="routeNumber">Номер маршрута:</label>
        <input type="text" id="routeNumber" placeholder="Номер маршрута">

        <label for="vehicleNumber">Номер т/с:</label>
        <input type="text" id="vehicleNumber" placeholder="Номер т/с">

        <label for="price">Стоимость поездки:</label>
        <input type="text" id="price" placeholder="Стоимость поездки">

        <button onclick="showTicket()">Показать билет</button>
    </div>

    <!-- Билет (открывается после нажатия кнопки) -->
    <div class="ticket-container" id="ticketSection" style="display: none;">
        <div class="ticket">
            <div class="header">
                <span>Уведомление об оплате</span>
            </div>
            <div class="logo-container">
                <img src="sbp_logo.jpg" alt="СБП" class="logo">
            </div>
            <p>Ваш проезд успешно оплачен!</p>
            <div class="ticket-details">
                <p><strong id="displayType">Автобус</strong>: №<span id="displayBusNumber"></span></p>
                <h2 class="price"><span id="displayPrice"></span></h2>
                <p id="currentDate"></p>
                <p class="vehicle-number-row">Т/С: <span id="displayVehicleNumber"></span></p>
            </div>
            <p>С момента оплаты прошло: <span id="timer">00:00</span></p>
        </div>

        <div class="qr-code-container">
            <img id="qrCode" src="" alt="QR Code" class="qr-code">
        </div>

        <div class="sticky-banner">
            <p>Ваша поездка оплачена, пожалуйста, сохраните билет в памяти телефона до конца поездки</p>
            <button onclick="saveTicket()">Сохранить билет</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
