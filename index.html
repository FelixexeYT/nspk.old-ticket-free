<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата проезда</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="input-container" id="inputSection">
        <input type="text" id="busNumber" placeholder="Номер автобуса">
        <input type="text" id="vehicleNumber" placeholder="Номер т/с">
        <input type="text" id="price" placeholder="Стоимость поездки">
        <button onclick="showTicket()">Показать билет</button>
    </div>

    <div class="ticket-container" id="ticketSection" style="display: none;">
        <div class="ticket">
            <div class="header">
                <span>Уведомление об оплате</span>
            </div>
            <div class="logo-container">
                <img src="sbp_logo.jpg" alt="СБП" class="logo">
            </div>
            <p>Ваш проезд успешно оплачен!</p>
            <div class="ticket-details">
                <p><strong>Автобус:</strong> <span id="displayBusNumber"></span></p>
                <h2 class="price"><span id="displayPrice"></span></h2>
                <p id="currentDate"></p>
                <p>Т/С: <span id="displayVehicleNumber"></span></p>
            </div>
            <p>С момента оплаты прошло: <span id="timer">00:00</span></p>
        </div>
    </div>

    <div class="sticky-banner">
        <p>Ваша поездка оплачена, пожалуйста, сохраните билет в памяти телефона до конца поездки</p>
        <button onclick="startTimer()">Сохранить билет</button>
    </div>

    <div class="qr-code-container">
    <a href="https://qr.bilet.nspk.ru/payment?paytagid=103000100598asdaf" target="_blank">
        <img src="qr-code.png" alt="QR Code" class="qr-code">
    </a>
    </div>

    <script src="script.js"></script>
</body>
</html>
