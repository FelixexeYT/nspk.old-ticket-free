<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата проезда</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ФОРМА -->
    <div class="card" id="inputSection">
        <h1>Данные билета</h1>

        <label for="transportType">Вид транспорта:</label>
        <select id="transportType">
            <option value="Автобус">Автобус</option>
            <option value="Троллейбус">Троллейбус</option>
        </select>

        <label for="ticketType">Тип билета:</label>
        <select id="ticketType">
            <option value="oldspb">Старый СПБ</option>
            <option value="spb">СПБ</option>
            <option value="2gis">2ГИС</option>
        </select>

        <label for="routeNumber">Номер маршрута:</label>
        <input type="text" id="routeNumber" placeholder="Введите номер маршрута">

        <label for="vehicleNumber">Номер т/с:</label>
        <input type="text" id="vehicleNumber" placeholder="Введите номер ТС">

        <label for="price">Стоимость проезда:</label>
        <input type="text" id="price" placeholder="Введите стоимость">

        <button onclick="showTicket()">Продолжить</button>
    </div>

    <!-- БИЛЕТ (Старый СПБ) -->
    <div class="old-ticket" id="ticketSection" style="display: none;">

        <!-- Шапка -->
        <div class="old-header">Уведомление об оплате</div>

        <!-- Основной контент -->
        <div class="old-body" id="ticketToDownload">
            <div class="old-logo-wrap">
                <img src="sbp_logo.jpg" alt="СБП" class="old-logo">
            </div>

            <p class="old-success">Ваш проезд успешно оплачен!</p>

            <div class="old-transport"><span id="displayType">Троллейбус</span>: №<span id="displayBusNumber"></span></div>
            <div class="old-price"><span id="displayPrice">40</span> <span class="old-price-currency">₽</span></div>

            <div class="old-date" id="currentDate"></div>
            <div class="old-vehicle">Т/С: <span id="displayVehicleNumber"></span></div>

            <div class="old-timer-label">С момента оплаты прошло:</div>
            <div class="old-timer-value" id="timer">00:00</div>

            <div class="old-qr-wrap">
                <img id="qrCode" src="" alt="QR-код" class="old-qr">
            </div>

            <div class="old-serial">
                <div>Серия билета: <span id="displaySerial"></span></div>
                <div>Номер билета: <span id="displayTicketNumber"></span></div>
            </div>

            <div class="old-hint">
                Предъявите контролеру QR-код.<br>
                Чтобы сохранить реквизиты билета,<br>
                нажмите кнопку «Скачать».
            </div>

            <button class="old-download-btn" onclick="downloadTicket()">Скачать билет</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
